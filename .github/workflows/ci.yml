name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libunicorn-dev libcapstone-dev zlib1g-dev ninja-build

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install unicorn capstone zlib ninja

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the C library
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Import smoke test
        run: |
          pip install .
          python -c "import vardoger; print('vardoger OK:', vardoger.VM)"
