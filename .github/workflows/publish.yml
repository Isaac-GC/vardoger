name: publish

# Tag a release (git tag v0.1.0 && git push --tags) to build wheels and publish them to PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels ${{ matrix.archs }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Build every wheel on a runner NATIVE to its arch — no emulation, no
      # cross-compile. before-all installs Unicorn/Capstone via each platform's
      # package manager (brew / build-from-source), which only provides the
      # runner's own arch, so cross-building can't link.
      matrix:
        include:
          - { os: ubuntu-latest, archs: x86_64 }     # manylinux x86_64
          - { os: ubuntu-24.04-arm, archs: aarch64 } # manylinux aarch64 (native ARM runner)
          - { os: macos-14, archs: arm64 }           # Apple Silicon
          - { os: macos-13, archs: x86_64 }          # Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # cibuildwheel builds one wheel per Python version inside a manylinux (or macOS) environment.
      # before-all there installs Unicorn/Capstone/zlib (see pyproject.toml), and auditwheel/delocate
      # bundle them into the wheel so it needs nothing at install time.
      - uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # PyPI Trusted Publishing (OIDC); no API token to store.
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
