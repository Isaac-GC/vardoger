[build-system]
requires = ["scikit-build-core>=0.8"]
build-backend = "scikit_build_core.build"

# Distribution name is vardoger-vm (the plain `vardoger` name is taken on PyPI by an
# unrelated project); the import package is still `vardoger` (see wheel.packages below),
# so: pip install vardoger-vm  ->  import vardoger.
[project]
name = "vardoger-vm"
version = "0.5.0"
description = "Drive the vardoger faithful-Android ARM64 runtime from Python."
readme = "python/vardoger/README.md"
requires-python = ">=3.10"
keywords = ["android", "emulator", "unicorn", "reverse-engineering", "dex"]
license = { text = "LGPL-3.0-only" }
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/Isaac-GC/vardoger"
Source = "https://github.com/Isaac-GC/vardoger"

# scikit-build-core drives the existing CMakeLists. The SKBUILD branch there installs
# libvardoger_capi.so into the vardoger package, so the ctypes loader finds it beside __init__.py.
[tool.scikit-build]
minimum-version = "0.8"
cmake.version = ">=3.24"
wheel.packages = ["python/vardoger"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

# Wheel building. The three native dependencies (unicorn, capstone, zlib) are not in the manylinux
# base image, so before-all builds them from source; auditwheel/delocate then fold them into the
# wheel so it is self-contained. Adjust the versions as needed.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux*"
build-verbosity = 1
test-command = "python -c \"import vardoger; print(vardoger.VM)\""

[tool.cibuildwheel.linux]
before-all = "bash scripts/install_native_deps.sh"
# install_native_deps.sh builds Unicorn/Capstone into /usr/local, but manylinux's
# pkg-config doesn't search there and env set inside before-all doesn't reach the
# build step — so point pkg-config (CMake's pkg_check_modules) and the loader at it
# here, where cibuildwheel applies it to every step.
environment = { PKG_CONFIG_PATH = "/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig", LD_LIBRARY_PATH = "/usr/local/lib:/usr/local/lib64" }

[tool.cibuildwheel.macos]
before-all = "brew install unicorn capstone zlib"
